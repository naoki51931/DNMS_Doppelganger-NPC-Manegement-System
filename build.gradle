plugins {
    id 'fabric-loom' version '1.7.4'
}
version = '0.1.0'
group = 'org.nagineco.doppel'
base { archivesName = 'doppelganger-npc-system' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.110.0+1.21.1'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

// Compile the optional patch into the Fabric mod so it can run by default.
sourceSets {
    main {
        java.srcDir 'patches/memory-integration/src'
        java.srcDir 'patches/automatic-movement/src'
        java.srcDir 'patches/reward-learning/src'
        java.srcDir 'patches/nao-growth/src'
        java.srcDir 'patches/player-appearance/src'
    }
}
