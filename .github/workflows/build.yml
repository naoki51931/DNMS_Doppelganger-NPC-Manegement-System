name: Fabric build verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Print build toolchain
        run: |
          java -version
          gradle --version
      - name: Run learning persistence and checkpoint regression tests
        run: |
          gradle --no-daemon --stacktrace clean test \
            --tests 'org.nagineco.doppel.core.NpcLearningStoreTest' \
            --tests 'org.nagineco.doppel.core.NpcLearningStateTest' \
            --tests 'org.nagineco.doppel.NpcLearningCheckpointTest' \
            --tests 'org.nagineco.doppel.LearningGenerationIntegrationTest'
      - name: Verify autonomous construction journey and route scheduling
        run: |
          gradle --no-daemon --stacktrace test \
            --tests 'org.nagineco.doppel.core.NaoConstructionJourneyIntegrationTest' \
            --tests 'org.nagineco.doppel.core.NaoRouteScheduleTest' \
            --tests 'org.nagineco.doppel.core.NaoGridPathfinderTest' \
            --tests 'org.nagineco.doppel.core.NaoConstructionWorkflowTest' \
            --tests 'org.nagineco.doppel.core.NaoBuildingPlanTest'
      - name: Compile and build Fabric mod (all tests)
        run: |
          # Always use the pinned Gradle from setup-gradle; a wrapper may select another version.
          gradle --no-daemon --stacktrace build
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dnms-build-diagnostics
          path: |
            build/reports/tests/**
            build/test-results/**
            build/reports/problems/**
          if-no-files-found: ignore
      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dnms-fabric-build
          path: build/libs/*.jar

  native-prototypes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile all C++ prototypes with warnings as errors
        run: |
          set -eu
          mkdir -p /tmp/dnms-native
          for src in src/doppel_day_loop.cpp src/doppel_integrated.cpp src/doppel_npc.cpp src/doppel_switch.cpp; do
            g++ -std=c++17 -Wall -Wextra -Werror -O2 "$src" -o "/tmp/dnms-native/$(basename "$src" .cpp)"
          done
      - name: Smoke-test 256 active Nao boundary
        run: |
          set -eu
          printf 'next\n%.0s' {1..24} > /tmp/dnms-native/commands.txt
          printf 'add 232\nselect 256\nstatus\nquit\n' >> /tmp/dnms-native/commands.txt
          /tmp/dnms-native/doppel_integrated < /tmp/dnms-native/commands.txt > /tmp/dnms-native/integrated.log
          grep -q 'Active Naos: 256/256' /tmp/dnms-native/integrated.log
          grep -q 'Now controlling #256' /tmp/dnms-native/integrated.log
          printf 'add 232\n256\nq\n' | /tmp/dnms-native/doppel_switch > /tmp/dnms-native/switch.log
          grep -q 'Active: 256/256' /tmp/dnms-native/switch.log
          grep -q 'Now controlling #256' /tmp/dnms-native/switch.log
