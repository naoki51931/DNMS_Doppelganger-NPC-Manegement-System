name: Fabric build verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Print build toolchain
        run: |
          java -version
          gradle --version
      - name: Compile and build Fabric mod
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dnms-build-diagnostics
          path: |
            build/reports/tests/**
            build/test-results/**
            build/reports/problems/**
          if-no-files-found: ignore
      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dnms-fabric-build
          path: build/libs/*.jar
