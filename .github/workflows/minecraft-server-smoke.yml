name: Minecraft Fabric server smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/**'
      - 'build.gradle'
      - 'src/main/resources/fabric.mod.json'
      - '.github/workflows/minecraft-server-smoke.yml'

jobs:
  fabric-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build DNMS mod
        run: gradle --no-daemon --stacktrace remapJar
      - name: Install official Fabric 1.21.1 dedicated server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/mods
          cd server
          curl --fail --location --retry 3 --silent --show-error \
            -o fabric-installer.jar \
            https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.1/fabric-installer-1.0.1.jar
          java -jar fabric-installer.jar server -mcversion 1.21.1 -loader 0.16.10 -downloadMinecraft
          printf 'eula=true\n' > eula.txt
          printf 'server-port=25575\nonline-mode=true\nview-distance=3\nsimulation-distance=3\nmax-players=1\n' > server.properties
          curl --fail --location --retry 3 --silent --show-error \
            -o mods/fabric-api.jar \
            'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.110.0+1.21.1/fabric-api-0.110.0+1.21.1.jar'
          find ../build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*dev*' -exec cp {} mods/ \;
          test -n "$(find mods -maxdepth 1 -name 'doppelganger-npc-system-*.jar' -print -quit)"
      - name: Boot Minecraft and verify mod initialization
        shell: bash
        run: |
          set -euo pipefail
          cd server
          mkfifo minecraft-console
          exec 3<>minecraft-console
          java -Ddnms.ci.smoke=true -Xms512M -Xmx2G -jar fabric-server-launch.jar nogui < minecraft-console > minecraft.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 150); do
            if grep -Eq 'Done \([0-9.]+s\)!' minecraft.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Minecraft server exited before startup completed'
              tail -150 minecraft.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Minecraft server startup timed out'
            tail -150 minecraft.log
            exit 1
          fi
          grep -Eq 'Loading [0-9]+ mods' minecraft.log
          grep -Eiq 'doppelganger|DoppelgangerMod|doppel npc' minecraft.log || {
            echo 'No DNMS evidence in server log'
            tail -150 minecraft.log
            exit 1
          }
          printf '%s\n' dnms_ci_spawn >&3
          spawned=0
          for attempt in $(seq 1 30); do
            if grep -q 'DNMS_CI_SPAWN_OK count=24' minecraft.log; then
              spawned=1
              break
            fi
            if grep -q 'DNMS_CI_SPAWN_FAILED' minecraft.log; then
              tail -100 minecraft.log
              exit 1
            fi
            sleep 1
          done
          if [ "$spawned" -ne 1 ]; then
            echo 'DNMS CI entity spawn command did not confirm 24 entities'
            tail -100 minecraft.log
            exit 1
          fi
          printf '%s\n' dnms_ci_bootstrap >&3
          bootstrapped=0
          for attempt in $(seq 1 40); do
            if grep -q 'DNMS_CI_REAL_BOOTSTRAP_OK identities=24 ghosts=24' minecraft.log; then
              bootstrapped=1
              break
            fi
            if grep -q 'DNMS_CI_REAL_BOOTSTRAP_FAILED' minecraft.log; then
              echo 'Real DNMS bootstrap failed'
              tail -120 minecraft.log
              exit 1
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Minecraft server exited during DNMS bootstrap'
              tail -120 minecraft.log
              exit 1
            fi
            sleep 1
          done
          if [ "$bootstrapped" -ne 1 ]; then
            echo 'Timed out waiting for real DNMS bootstrap'
            tail -120 minecraft.log
            exit 1
          fi
          echo 'DNMS real identities and NPC stand-ins bootstrapped successfully'
          # Allow the ordinary Fabric END_SERVER_TICK AI loop to run.
          sleep 10
          printf '%s\n' dnms_ci_movement >&3
          movement_ok=0
          for attempt in $(seq 1 30); do
            if grep -q 'DNMS_CI_MOVEMENT_OK' minecraft.log; then
              movement_ok=1
              break
            fi
            if grep -q 'DNMS_CI_MOVEMENT_FAILED' minecraft.log; then
              echo 'DNMS NPC movement test failed'
              tail -150 minecraft.log
              exit 1
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Minecraft server exited before movement verification'
              tail -150 minecraft.log
              exit 1
            fi
            sleep 1
          done
          if [ "$movement_ok" -ne 1 ]; then
            echo 'DNMS movement verification timed out'
            tail -150 minecraft.log
            exit 1
          fi
          grep 'DNMS_CI_MOVEMENT_RESULT' minecraft.log

          printf '%s\n' dnms_ci_work >&3
          work_ok=0
          for attempt in $(seq 1 30); do
            if grep -q 'DNMS_CI_HARVEST_OK' minecraft.log \
                && grep -q 'DNMS_CI_BUILD_OK' minecraft.log; then
              work_ok=1
              break
            fi
            if grep -q 'DNMS_CI_WORK_FAILED' minecraft.log; then
              echo 'Real Minecraft harvest/build work test failed'
              tail -150 minecraft.log
              exit 1
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Minecraft server exited during work verification'
              tail -150 minecraft.log
              exit 1
            fi
            sleep 1
          done
          if [ "$work_ok" -ne 1 ]; then
            echo 'Timed out waiting for Minecraft harvest/build verification'
            tail -150 minecraft.log
            exit 1
          fi
          echo 'Real Minecraft block harvesting and construction verified'
          # Run the normal AI tick loop with a real Nao identity and a controlled
          # harvest/build fixture, then assert observed world and progress changes.
          printf '%s\n' dnms_ci_autowork >&3
          autowork_ready=0
          for attempt in $(seq 1 20); do
            if grep -q 'DNMS_CI_AUTOWORK_READY' minecraft.log; then
              autowork_ready=1
              break
            fi
            if grep -q 'DNMS_CI_AUTOWORK_FAILED' minecraft.log; then
              tail -150 minecraft.log
              exit 1
            fi
            sleep 1
          done
          if [ "$autowork_ready" -ne 1 ]; then
            echo 'Nao autonomous work fixture failed to initialize'
            tail -150 minecraft.log
            exit 1
          fi
          # The AI can need several hundred ticks to return from gathering.
          # Poll the state instead of declaring failure at a fixed 20-second edge.
          autowork_ok=0
          for attempt in $(seq 1 90); do
            sleep 2
            printf '%s\n' dnms_ci_autowork_check >&3
            if grep -q 'DNMS_CI_AUTOWORK_OK' minecraft.log; then
              autowork_ok=1
              break
            fi
            if grep -q 'DNMS_CI_AUTOWORK_FAILED' minecraft.log; then
              echo 'Autonomous work reported a fatal setup error'
              tail -150 minecraft.log
              exit 1
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Minecraft server exited during autonomous work'
              tail -150 minecraft.log
              exit 1
            fi
          done
          if [ "$autowork_ok" -ne 1 ]; then
            echo 'Nao autonomous gather/build did not complete within 180 seconds'
            tail -150 minecraft.log
            exit 1
          fi
          grep 'DNMS_CI_AUTOWORK_RESULT' minecraft.log
          printf '%s\n' stop >&3
          echo 'Minecraft 1.21.1 Fabric server started and 24 test entities spawned'

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-smoke-logs
          path: server/minecraft.log
          if-no-files-found: ignore
