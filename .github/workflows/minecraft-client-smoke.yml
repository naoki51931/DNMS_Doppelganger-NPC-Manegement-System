name: Minecraft Fabric client smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/**'
      - 'build.gradle'
      - '.github/workflows/minecraft-client-smoke.yml'

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libopenal1
      - name: Launch Fabric development client
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' gradle --no-daemon runClient > client-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 360); do
            if grep -Ei 'Mixin apply failed|MixinTransformerError|InvalidInjectionException|InjectionError|Crash report saved' client-smoke.log; then
              tail -150 client-smoke.log
              exit 1
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -150 client-smoke.log
              exit 1
            fi
            if grep -Eq 'Created: .*textures/atlas/blocks.png-atlas' client-smoke.log; then
              sleep 20
              kill -0 "$pid"
              if grep -Ei 'Mixin apply failed|MixinTransformerError|InvalidInjectionException|InjectionError|Crash report saved' client-smoke.log; then exit 1; fi
              echo 'Client reached texture atlas initialization and remained running; NPC rendering not tested.'
              exit 0
            fi
            sleep 2
          done
          tail -150 client-smoke.log
          exit 1
      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-client-smoke-logs
          path: |
            client-smoke.log
            run/logs/latest.log
            run/crash-reports/
